[package]
name = "glinker-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of Knowledgator GLinker (zero-shot entity linking) on orp/ort"
license = "Apache-2.0"

[features]
default = ["load-dynamic"]
# Link ONNX Runtime at run time (set ORT_DYLIB_PATH). Works offline / in Colab with pip onnxruntime.
load-dynamic = ["orp/load-dynamic", "ort/load-dynamic"]
cuda = ["orp/cuda", "ort/cuda"]
tensorrt = ["orp/tensorrt", "ort/tensorrt"]
openvino = ["orp/openvino", "ort/openvino"]

[dependencies]
orp = "=1.0.0"
ort = "=2.0.0-rc.9"
composable = "1.0"
ndarray = "0.16"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }

[profile.release]
lto = "thin"
